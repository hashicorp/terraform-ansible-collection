---
# Integration tests for stack_deployment_group_info module.
#
# Stack deployment groups are created automatically when a stack configuration
# deploys — there is no direct create/delete API for them. These tests
# therefore rely on a pre-existing stack configuration ID supplied via the
# integration config (stc_id) and the deployment name (sdg_name) used in that
# configuration.
#
# Required variables (set in tests/integration/integration_config.yml):
#   tfc_token         - Terraform Cloud / TFE API token
#   organization      - Organization name
#   stc_id            - An existing stack configuration ID (stc-...)
#   sdg_id            - A known deployment group ID within that configuration (sdg-...)
#   sdg_name          - The deployment name of that group (e.g. "dev")

- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    # info: read by ID
    - name: Read deployment group by ID
      hashicorp.terraform.stack_deployment_group_info:
        stack_deployment_group_id: "{{ sdg_id }}"
      register: result_by_id

    - name: Assert read by ID succeeded
      ansible.builtin.assert:
        that:
          - not result_by_id.changed
          - result_by_id.stack_deployment_group.id == sdg_id
          - result_by_id.stack_deployment_group.name is defined
          - result_by_id.stack_deployment_group.status is defined


    # info: read by name within stack configuration
    - name: Read deployment group by name
      hashicorp.terraform.stack_deployment_group_info:
        stack_configuration_id: "{{ stc_id }}"
        name: "{{ sdg_name }}"
      register: result_by_name

    - name: Assert read by name succeeded
      ansible.builtin.assert:
        that:
          - not result_by_name.changed
          - result_by_name.stack_deployment_group.name == sdg_name
          - result_by_name.stack_deployment_group.id is defined


    # info: not-found by ID raises an error
    - name: Read a non-existent deployment group by ID (expect failure)
      hashicorp.terraform.stack_deployment_group_info:
        stack_deployment_group_id: "sdg-doesnotexist000"
      register: result_not_found_by_id
      ignore_errors: true

    - name: Assert not-found-by-ID error was raised
      ansible.builtin.assert:
        that:
          - result_not_found_by_id is failed
          - "'not found' in result_not_found_by_id.msg"

    # info: not-found by name raises an error
    - name: Read a deployment group using a valid config ID but invalid name (expect failure)
      hashicorp.terraform.stack_deployment_group_info:
        stack_configuration_id: "{{ stc_id }}"
        name: "ghost"
      register: result_not_found_by_name
      ignore_errors: true

    - name: Assert not-found-by-name error was raised
      ansible.builtin.assert:
        that:
          - result_not_found_by_name is failed
          - "'not found' in result_not_found_by_name.msg"

---
- name: Set module defaults
  module_defaults:
    group/hashicorp.terraform.terraform:
      tfe_token: "{{ tfc_token }}"

  block:
    - name: Generate a unique ID
      ansible.builtin.set_fact:
        unique_id: "{{ lookup('pipe', 'uuidgen') | lower }}"

    # ---------- create (no oidc_configuration_id => always creates) ----------
    - name: Create an Azure OIDC configuration
      hashicorp.terraform.azure_oidc_configuration:
        organization: "{{ organization }}"
        client_id: "{{ unique_id }}"
        subscription_id: "11111111-1111-1111-1111-111111111111"
        tenant_id: "22222222-2222-2222-2222-222222222222"
        state: present
      register: result_create

    - name: Assert Azure OIDC configuration creation was successful
      ansible.builtin.assert:
        that:
          - result_create.changed
          - result_create.id is defined
          - result_create.client_id == unique_id

    - name: Save oidc_configuration_id fact
      ansible.builtin.set_fact:
        azure_oidc_configuration_id: "{{ result_create.id }}"

    # ---------- idempotent re-apply, identified by ID ----------
    - name: Idempotency test - re-apply the same client_id by ID
      hashicorp.terraform.azure_oidc_configuration:
        oidc_configuration_id: "{{ azure_oidc_configuration_id }}"
        client_id: "{{ unique_id }}"
        state: present
      register: result_reapply

    - name: Assert re-apply was a no-op
      ansible.builtin.assert:
        that:
          - not result_reapply.changed
          - result_reapply.id == azure_oidc_configuration_id

    # ---------- update on drift, identified by ID ----------
    - name: Update the tenant_id by ID
      hashicorp.terraform.azure_oidc_configuration:
        oidc_configuration_id: "{{ azure_oidc_configuration_id }}"
        tenant_id: "33333333-3333-3333-3333-333333333333"
        state: present
      register: result_update

    - name: Assert update was applied
      ansible.builtin.assert:
        that:
          - result_update.changed
          - result_update.tenant_id == "33333333-3333-3333-3333-333333333333"

    # ---------- info lookup ----------
    - name: Look up the Azure OIDC configuration by ID
      hashicorp.terraform.azure_oidc_configuration_info:
        oidc_configuration_id: "{{ azure_oidc_configuration_id }}"
      register: result_info

    - name: Assert info matches the updated configuration
      ansible.builtin.assert:
        that:
          - result_info.oidc_configuration.id == azure_oidc_configuration_id
          - result_info.oidc_configuration.tenant_id == "33333333-3333-3333-3333-333333333333"

    # ---------- check-mode absent ----------
    - name: Check-mode delete
      hashicorp.terraform.azure_oidc_configuration:
        oidc_configuration_id: "{{ azure_oidc_configuration_id }}"
        state: absent
      check_mode: true
      register: result_check_mode

    - name: Assert check-mode reports change without applying
      ansible.builtin.assert:
        that:
          - result_check_mode.changed
          - "'check mode' in result_check_mode.msg"

    # ---------- absent ----------
    - name: Delete the Azure OIDC configuration
      hashicorp.terraform.azure_oidc_configuration:
        oidc_configuration_id: "{{ azure_oidc_configuration_id }}"
        state: absent
      register: result_delete

    - name: Assert delete was successful
      ansible.builtin.assert:
        that:
          - result_delete.changed
          - "'deleted' in result_delete.msg"

    - name: Delete the same Azure OIDC configuration again (no-op)
      hashicorp.terraform.azure_oidc_configuration:
        oidc_configuration_id: "{{ azure_oidc_configuration_id }}"
        state: absent
      register: result_delete_again

    - name: Assert second delete was a no-op
      ansible.builtin.assert:
        that:
          - not result_delete_again.changed
          - "'absent' in result_delete_again.msg"

  always:
    - name: Cleanup - best-effort delete the Azure OIDC configuration (in case of mid-run failure)
      hashicorp.terraform.azure_oidc_configuration:
        oidc_configuration_id: "{{ azure_oidc_configuration_id }}"
        state: absent
      when: azure_oidc_configuration_id is defined
      failed_when: false

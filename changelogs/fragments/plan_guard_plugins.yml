minor_changes:
  - >-
    plan_guard filter / plan_safe test - New pure, offline plugins
    ``hashicorp.terraform.plan_guard`` (filter) and
    ``hashicorp.terraform.plan_safe`` (test) that evaluate a
    ``plan_analyze`` result against user-defined ``allow`` / ``deny`` rules
    and return an auditable ``safe_to_refresh`` decision for gating a
    refresh-only apply that absorbs approved drift into Terraform state.
    Unlike a module, both are usable inline (for example directly in
    ``when:``) since they perform no I/O and never fork a Python
    interpreter. Rules use the same canonical attribute-matching grammar as
    ``plan_analyze`` classification; ``deny`` always wins over ``allow``,
    ``strict`` mode (default) is fail-closed, and a resource
    ``plan_analyze`` already classified ``blocked`` is escalated
    unconditionally. Not a replacement for TFE-native Sentinel/OPA policy
    checks.

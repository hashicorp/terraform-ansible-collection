---
bugfixes:
  - >-
    run - Poll for completion states appropriate to auto-apply, speculative,
    saved-plan, apply, discard, and cancel operations instead of accepting an
    unrelated intermediate state.
  - >-
    promote_run - Wait for post-apply completion, honor Terraform's
    is_confirmable capability, and support planned_and_saved runs.
  - >-
    policy_set and variable_sets - Normalize pytfe's Python-safe aliases for
    the global field so global=false remains idempotent.
  - >-
    notification_configuration - Do not report perpetual drift for the
    write-only webhook token on an existing notification.


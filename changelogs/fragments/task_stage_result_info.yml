minor_changes:
  - >-
    task_stage_info module - New module
    ``hashicorp.terraform.task_stage_info`` to read a single run task stage by
    ``task_stage_id`` (optionally sideloading related resources via
    ``include``) or list every task stage for a run by ``run_id``, on Terraform
    Cloud and Terraform Enterprise.
  - >-
    task_result_info module - New module
    ``hashicorp.terraform.task_result_info`` to read a single run task result by
    ``task_result_id`` on Terraform Cloud and Terraform Enterprise.

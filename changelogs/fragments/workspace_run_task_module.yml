minor_changes:
  - >-
    workspace_run_task module - New module
    ``hashicorp.terraform.workspace_run_task`` to associate an existing
    organization run task with a workspace, update its enforcement level and run
    stages, or remove the association, on Terraform Cloud and Terraform
    Enterprise. The workspace is identified by ``workspace_id`` or
    ``(organization, workspace)``, and the run task by ``run_task_id`` or
    ``run_task_name``; an existing association can also be targeted by
    ``workspace_run_task_id``. Idempotent on ``present`` with ``check_mode``
    support.
  - >-
    workspace_run_task_info module - New module
    ``hashicorp.terraform.workspace_run_task_info`` to retrieve a workspace run
    task association by ``workspace_run_task_id`` or by run task, or list every
    run task associated with a workspace.

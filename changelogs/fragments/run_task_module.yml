minor_changes:
  - >-
    run_task module - New module ``hashicorp.terraform.run_task`` to create,
    update, and delete organization-scoped run tasks on Terraform Cloud and
    Terraform Enterprise. Supports identifying a run task by ``run_task_id`` or
    by ``(organization, name)``, configuring the invocation ``url``,
    ``description``, ``enabled`` flag, optional ``hmac_key`` (write-only),
    ``agent_pool_id``, and a ``global_configuration`` block (``enabled`` /
    ``stages`` / ``enforcement_level``). Idempotent on ``present`` with
    ``check_mode`` support.
  - >-
    run_task_info module - New module ``hashicorp.terraform.run_task_info`` to
    retrieve run task details by ``run_task_id``, by ``(organization, name)``,
    or list every run task in an organization.

minor_changes:
  - >-
    Added a family of policy management modules: ``policy``/``policy_info`` (standalone
    Sentinel/OPA/tf-policy policies, with genuine content drift detection via the API's
    round-trippable upload/download), ``policy_set``/``policy_set_info`` (policy sets, including
    inline diff-and-sync of all five relationship types - policies, workspaces,
    workspace_exclusions, projects, project_exclusions - against a policy set's current
    membership), ``policy_set_version``/``policy_set_version_info`` (create-then-upload a new
    version for non-VCS-backed policy sets, mirroring ``configuration_version``'s shape),
    ``policy_set_parameter``/``policy_set_parameter_info`` (key/value parameters on a policy
    set, with the same sensitive-value write-only handling as the ``variable`` module),
    ``policy_evaluation_info`` and ``policy_set_outcome_info`` (read-only OPA policy evaluation
    results), and ``policy_check``/``policy_check_info`` (the legacy Sentinel policy-checks
    surface, extending the existing ``policy_check`` module_utils helper used by
    ``promote_run`` and the ``tf_policy_checks`` lookup - ``policy_check`` adds an idempotent
    override action). ``kind`` is immutable after creation on both ``policy`` and
    ``policy_set``; supplying a different value against an existing resource fails with a
    clear message rather than silently ignoring the drift.
